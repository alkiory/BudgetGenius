services:
  backend:
    container_name: bg-backend-gce
    # The deploy workflow builds and pushes this image; the VM only receives
    # the compose files, so it must pull instead of trying a local build.
    image: ${API_IMAGE:-finance-api:latest}
    ports:
      - "3000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - PGSSLMODE=disable
      - DB_HOST=database
      - DB_NAME=budgetgenius_prod
      - DB_USER=postgres_admin_prod
      # DB_PASS/DB_PASSWORD is provided via the .env file
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      # Uploaded catalogue images live outside the container so a deploy
      # (which recreates it) does not delete pages' assets.
      - UPLOAD_DIR=/data
    volumes:
      - api_uploads:/data
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  database:
    container_name: bg-db-gce
    environment:
      - POSTGRES_USER=postgres_admin_prod
      - POSTGRES_DB=budgetgenius_prod
    env_file:
      - .env # Provides POSTGRES_PASSWORD
    volumes:
      - pgdata_gce:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U postgres_admin_prod -d budgetgenius_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: bg-redis-gce
    # QA-0.6 — mismo patrón que docker-compose.prod.yml: AUTH obligatorio.
    # Antes se volcaba el `.env` completo en este contenedor "por si" traía
    # REDIS_PASSWORD, pero Redis arrancaba sin `--requirepass`: si la
    # variable existía, el API enviaba AUTH a un servidor que no lo pedía y
    # la conexión fallaba. El `:?` aborta el `up` si falta la variable, en
    # vez de arrancar abierto en silencio.
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redisdata_gce:/data
    healthcheck:
      # `ping` a secas da NOAUTH: el contenedor nunca sería healthy y el
      # backend no arrancaría (depends_on: service_healthy).
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata_gce:
  redisdata_gce:
  api_uploads:
