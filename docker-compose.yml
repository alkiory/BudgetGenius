name: BudgetGenius

services:
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    # Uploaded catalogue images live outside the container: recreating the
    # service must not delete the assets authored in the backoffice.
    environment:
      - UPLOAD_DIR=/data
    volumes:
      - api_uploads:/data
    networks:
      - app-network

  database:
    image: postgres:15-alpine
    restart: always
    networks:
      - app-network

  redis:
    image: redis:7.2-alpine
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  api_uploads:
