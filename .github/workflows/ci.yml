name: CI/CD Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    # The e2e spec (`user-delete-permission.spec.ts`) boots the real
    # AppModule and signs users up through HTTP, so the API suite needs a
    # live Postgres (schema + migrations) and Redis (throttler storage).
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: budgetgenius_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@12.23.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Creates the `bg_public` schema (premigration) and applies every
      # migration, so the DB-backed e2e assertions run against real tables.
      - name: Migrate test database (api)
        run: pnpm --filter api migration:run
        env: &backend-test-env
          NODE_ENV: development
          JWT_SECRET: test-secret
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASS: postgres
          DB_NAME: budgetgenius_test
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          COOKIE_DOMAIN: localhost
          FRONTEND_URL: http://localhost:5173
          # The mailer refuses to construct without a key (fail-fast against
          # silent forgot-password failures). Tests never hit the Resend API.
          RESEND_API_KEY: re_ci_placeholder

      - name: Run Tests (api)
        run: pnpm --filter api test
        env: *backend-test-env

      - name: Login to DockerHub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/finance-api:latest -f ./apps/api/Dockerfile .
          docker push ${{ secrets.DOCKER_USERNAME }}/finance-api:latest

      - name: Copy Compose files to GCE
        if: github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.gce.yml"
          target: "/home/${{ secrets.GCE_USER }}/budgetgenius"

      - name: Deploy to GCE via SSH
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_KEY }}
          script: |
            cd /home/${{ secrets.GCE_USER }}/budgetgenius
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" > .env
            echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
            echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> .env
            echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> .env
            echo "FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}" >> .env
            # Handle multi-line private key correctly
            echo "FIREBASE_PRIVATE_KEY=\"${{ secrets.FIREBASE_PRIVATE_KEY }}\"" >> .env

            # Pull latest backend image
            docker compose -f docker-compose.yml -f docker-compose.gce.yml pull backend

            # Start/Restart services (omitting frontend)
            docker compose -f docker-compose.yml -f docker-compose.gce.yml up -d backend database redis

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@12.23.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # `check-types` is `tsc -b`. The old `tsc --noEmit` ran against a
      # solution tsconfig with `files: []` and exited 0 without checking a
      # single source file (false green).
      - name: Typecheck (frontend)
        run: pnpm --filter frontend-web check-types

      # Builds both web surfaces: the Astro landing (root) and the SPA
      # (base /app/), then merges them into dist/ exactly as deploy does.
      - name: Build (landing + SPA)
        run: pnpm build:web
