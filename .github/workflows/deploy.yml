name: Deploy

# Production deploys run on every push to main, or manually from any ref
# (Actions → Deploy → Run workflow). The verify job repeats the checks that
# gate the artifacts, so a red test suite can never ship.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: budgetgenius_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@12.23.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate test database (api)
        run: pnpm --filter api migration:run
        env: &backend-test-env
          NODE_ENV: development
          JWT_SECRET: test-secret
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASS: postgres
          DB_NAME: budgetgenius_test
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          REDIS_URL: redis://localhost:6379
          COOKIE_DOMAIN: localhost
          FRONTEND_URL: http://localhost:5173
          RESEND_API_KEY: re_ci_placeholder
          # ReportService builds the OpenAI client at construction time and
          # the Google strategy requires a clientID on boot.
          OPENAI_API_KEY: sk-ci-placeholder
          GOOGLE_CLIENT_ID: test-client-id.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: test-client-secret

      - name: Run Tests (api)
        run: pnpm --filter api test
        env: *backend-test-env

      - name: Typecheck (frontend)
        run: pnpm --filter frontend-web check-types

      - name: Unit tests (frontend)
        run: pnpm --filter frontend-web test:unit

  api:
    name: API → GCE
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # `latest` is what the VM pulls; the commit tag keeps a rollback point.
      - name: Build and Push Docker Image
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/finance-api"
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" -f ./apps/api/Dockerfile .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      - name: Copy Compose files to GCE
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.gce.yml"
          target: "/home/${{ secrets.GCE_USER }}/budgetgenius"

      - name: Deploy to GCE via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_KEY }}
          script: |
            cd /home/${{ secrets.GCE_USER }}/budgetgenius
            # Compose reads this file for both compose interpolation and the
            # backend/database `env_file`. Every value is rewritten on each
            # deploy so the VM never runs on stale credentials.
            cat > .env <<'ENVEOF'
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            COOKIE_DOMAIN=${{ secrets.COOKIE_DOMAIN }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            MAIL_FROM=${{ secrets.MAIL_FROM }}
            SUPERADMIN_EMAIL=${{ secrets.SUPERADMIN_EMAIL }}
            SUPERADMIN_PASSWORD=${{ secrets.SUPERADMIN_PASSWORD }}
            PROVIDER_KEYS_SECRET=${{ secrets.PROVIDER_KEYS_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}
            FIREBASE_PRIVATE_KEY="${{ secrets.FIREBASE_PRIVATE_KEY }}"
            APP_REVISION=${{ github.sha }}
            API_IMAGE=${{ secrets.DOCKER_USERNAME }}/finance-api:latest
            ENVEOF

            # Pull the image built above instead of rebuilding on the VM
            # (the VM only receives compose files, not the source tree).
            if ! docker compose -f docker-compose.yml -f docker-compose.gce.yml pull backend; then
              echo "Could not pull the new backend image — keeping the running release"
              exit 1
            fi
            # Force the recreation: `up` alone would leave a container whose
            # cached image failed to update, and the old code would pass the
            # probe below.
            docker compose -f docker-compose.yml -f docker-compose.gce.yml up -d --no-build --force-recreate backend
            docker compose -f docker-compose.yml -f docker-compose.gce.yml ps

            # The root payload includes APP_REVISION. A healthy old container
            # would still answer `/api`, so require the new revision to prove
            # the image that came up is the one just built.
            for attempt in $(seq 1 20); do
              if curl -fsS http://localhost:3000/api | grep -q "${{ github.sha }}"; then
                echo "API healthy on revision ${{ github.sha }} after $attempt attempt(s)"
                exit 0
              fi
              sleep 3
            done
            docker compose -f docker-compose.yml -f docker-compose.gce.yml logs --tail=80 backend
            exit 1

  web:
    name: Web → Firebase Hosting
    needs: verify
    runs-on: ubuntu-latest
    env:
      # Build-time config: Vite inlines every VITE_* value. Set here (not only
      # on the build step) because firebase.json's predeploy runs `build:web`
      # again from the action and must see the same version/config.
      VITE_APP_VERSION: ${{ github.sha }}
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
      PUBLIC_APK_URL: ${{ vars.PUBLIC_APK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@12.23.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Landing at /, SPA at /app/ (base /app/), assembled into dist/.
      - name: Build (landing + SPA)
        run: pnpm build:web

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BUDGETGENIUSIA }}
          channelId: live
          projectId: budgetgeniusia
