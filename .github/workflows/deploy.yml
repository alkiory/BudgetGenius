name: Deploy

# Production deploys run on every push to main, or manually from any ref
# (Actions → Deploy → Run workflow). The verify job repeats the checks that
# gate the artifacts, so a red test suite can never ship.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: budgetgenius_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@12.23.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate test database (api)
        run: pnpm --filter api migration:run
        env: &backend-test-env
          NODE_ENV: development
          JWT_SECRET: test-secret
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASS: postgres
          DB_NAME: budgetgenius_test
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          REDIS_URL: redis://localhost:6379
          COOKIE_DOMAIN: localhost
          FRONTEND_URL: http://localhost:5173
          RESEND_API_KEY: re_ci_placeholder
          # ReportService builds the OpenAI client at construction time and
          # the Google strategy requires a clientID on boot.
          OPENAI_API_KEY: sk-ci-placeholder
          GOOGLE_CLIENT_ID: test-client-id.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: test-client-secret

      - name: Run Tests (api)
        run: pnpm --filter api test
        env: *backend-test-env

      - name: Typecheck (frontend)
        run: pnpm --filter frontend-web check-types

      - name: Unit tests (frontend)
        run: pnpm --filter frontend-web test:unit

  web:
    name: Web → Firebase Hosting
    needs: verify
    runs-on: ubuntu-latest
    env:
      # Build-time config: Vite inlines every VITE_* value. Set here (not only
      # on the build step) because firebase.json's predeploy runs `build:web`
      # again from the action and must see the same config.
      #
      # No VITE_APP_VERSION on purpose: vite.config.ts falls back to the root
      # package.json version, which the release flow bumps. Pinning it to the
      # commit SHA made the badge and the "what's new" tour announce
      # `v<sha>` instead of the release the user is actually running.
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
      PUBLIC_APK_URL: ${{ vars.PUBLIC_APK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@12.23.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Landing at /, SPA at /app/ (base /app/), assembled into dist/.
      - name: Build (landing + SPA)
        run: pnpm build:web

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BUDGETGENIUSIA }}
          channelId: live
          projectId: budgetgeniusia
