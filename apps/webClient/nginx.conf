server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # Astro hashed assets (landing).
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA hashed assets (base /app/).
    location /app/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routes: deep links resolve to the SPA shell, never to the landing.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location /auth/ {
        try_files $uri /app/index.html;
    }

    # Public pages that still live inside the SPA.
    location = /privacy-policy {
        try_files /app/index.html =404;
    }

    location = /terms-and-conditions {
        try_files /app/index.html =404;
    }

    location = /contact-sales {
        try_files /app/index.html =404;
    }

    location = /changelog {
        try_files /changelog/index.html =404;
    }

    location = /es/changelog {
        try_files /es/changelog/index.html =404;
    }

    # Everything else is a static Astro page (/, /es/, /404.html).
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
