apply plugin: 'com.android.application'

// Version defaults for local builds; the release workflow overrides both from
// the tag being published (v1.12.0 -> versionCode 11200).
def bgVersionCodeRaw = System.getenv("BG_VERSION_CODE")?.trim()
def bgVersionCode = (bgVersionCodeRaw?.isInteger() ? bgVersionCodeRaw.toInteger() : 11200)
def bgVersionName = System.getenv("BG_VERSION_NAME")?.trim() ?: "1.12.0"

// Release signing. The workflow decodes `KEYSTORE_BASE64` into $RUNNER_TEMP and
// exports these four variables, so the store/key passwords never appear on the
// Gradle command line (where they would leak into logs and process args).
// Without them (local builds, PR artifacts) no signing config is registered and
// `assembleRelease` stays unsigned instead of failing.
def bgKeystoreFile = System.getenv("BG_KEYSTORE_FILE")
def bgKeystorePassword = System.getenv("BG_KEYSTORE_PASSWORD")
def bgKeyAlias = System.getenv("BG_KEY_ALIAS")
def bgKeyPassword = System.getenv("BG_KEY_PASSWORD")
def hasReleaseSigning = [bgKeystoreFile, bgKeystorePassword, bgKeyAlias, bgKeyPassword].every { it }

android {
    namespace "com.budgetgenius.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.budgetgenius.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode bgVersionCode
        versionName bgVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(bgKeystoreFile)
                storePassword bgKeystorePassword
                keyAlias bgKeyAlias
                keyPassword bgKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// NOTE: ':capacitor-cordova-android-plugins' was removed from this list
// for the same reason as in settings.gradle — that empty shim's build.gradle
// pulls deprecated SDK extras via AGP's auto-installer, which fails on a
// modern cmdline-tools. With no Cordova plugins installed, the flatDir
// reference into its lib/ is dead weight.
repositories {
    flatDir{
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    // ':capacitor-cordova-android-plugins' removed — no Cordova plugins
    // installed (see settings.gradle for rationale).
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
