packages:
  - 'apps/*'

# Workspace-level overrides. pnpm 10+ stopped reading the `pnpm` field from
# the root package.json — these belong here. See
# https://pnpm.io/settings#workspace-overrides for the new home.
overrides:
  '@firebasegen/default-connector': link:dataconnect-generated/js/default-connector

# pnpm 12 blocks dependency lifecycle scripts unless explicitly approved.
# Firebase util generates its runtime config stub, SWC and esbuild install
# their platform binaries; other scripts reported by CI are informational
# or telemetry and stay disabled.
allowBuilds:
  '@firebase/util': true
  '@nestjs/core': false
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  protobufjs: false
  # sharp verifies its libvips binding on install; CI installs it as a direct
  # landing dependency, so an unapproved script turns `pnpm install` into
  # ERR_PNPM_IGNORED_BUILDS and fails the APK/CI jobs before the build starts.
  sharp: true

permissions:
  dotenv:
    skills: [dotenv]

skills:
  dirs:
    - .agent/skills
    - .agents/skills
    - .claude/skills
    - .cursor/skills
    - .gemini/skills
    - .github/skills
