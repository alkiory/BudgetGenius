name: budgetgenius-prod

services:
  backend:
    container_name: bg-backend-prod
    restart: always
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # ELIMINADO: El bloque "ports" para obligar al tráfico a pasar por NPM
    env_file:
      - ./apps/api/.env.production
    environment:
      - PORT=5000
      - NODE_ENV=production
      - PGSSLMODE=disable
      - DB_HOST=database
      - DB_NAME=budgetgenius_prod
      - DB_USER=postgres_admin_prod
      - DB_PASS=${DB_PASSWORD}
      # QA-0.6 — Redis exige AUTH. RedisService y el ThrottlerModule
      # leen esta misma variable.
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - app-network
      - npm_network
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  database:
    image: postgres:15-alpine
    container_name: bg-db-prod
    restart: always
    environment:
      - POSTGRES_USER=postgres_admin_prod
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=budgetgenius_prod
    ports:
      - "4002:5432"
    networks:
      - app-network
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_admin_prod -d budgetgenius_prod"]

  redis:
    image: redis:7.2-alpine
    container_name: bg-redis-prod
    restart: always
    # QA-0.6 — sin `--requirepass`, cualquier contenedor de la red
    # (o cualquiera que alcance el 6379 publicado) podía leer y escribir
    # los refresh tokens y los contadores del throttle. La interpolación
    # con `:?` hace fallar el `up` si la variable no está definida, en vez
    # de arrancar Redis abierto en silencio.
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - app-network
    volumes:
      - redisdata_prod:/data
    healthcheck:
      # `redis-cli ping` a secas devuelve NOAUTH y el contenedor nunca
      # llegaría a healthy (el backend no arrancaría por depends_on).
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

# DECLARACIÓN CRÍTICA: Registro de las redes a utilizar
networks:
  app-network:
    driver: bridge
  npm_network:
    external: true

volumes:
  pgdata_prod:
  redisdata_prod: